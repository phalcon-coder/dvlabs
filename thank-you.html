    <div class="page-loader" id="page-loader" aria-hidden="true">
  <img class="loader-logo" src="logo.png" alt="">
  <div class="loader-bar"></div>
  <div class="loader-text">Initializing<span class="cursor">&#9612;</span></div>
</div>
<script>
(function(){
  var loader = document.getElementById('page-loader');
  if(!loader) return;
  var minTime = 400;             // avoids a flash on fast loads
  var start = Date.now();
  function hide(){
    var wait = Math.max(0, minTime - (Date.now() - start));
    setTimeout(function(){
      loader.classList.add('is-hidden');
      setTimeout(function(){ loader.remove(); }, 600);
    }, wait);
  }
  if(document.readyState === 'complete'){ hide(); }
  else { window.addEventListener('load', hide); }
  setTimeout(hide, 8000);        // safety net so it never gets stuck
})();
</script>
